<!DOCTYPE html><html lang="en"><head><meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Patronus AI is a behavioral research lab for AI. We build worlds for models to explore, grounded in real work, and study what they do there and why."><meta name="theme-color" content="#eeeee6"><title>Site v2 lab | Patronus AI</title><link rel="icon" href="/patronus-preview/favicon.svg" type="image/svg+xml"><link rel="icon" href="/patronus-preview/favicon-light-32.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)"><link rel="icon" href="/patronus-preview/favicon-dark-32.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)"><link rel="icon" href="/patronus-preview/favicon.ico" sizes="32x32"><link rel="apple-touch-icon" href="/patronus-preview/apple-touch-icon.png"><link rel="manifest" href="/patronus-preview/site.webmanifest"><!-- the hero's two faces load first, so its headline and lede don't reflow when the fonts arrive --><link rel="preload" href="/patronus-preview/fonts/host-grotesk-latin-702afb.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/patronus-preview/fonts/source-serif-4-latin-8eff34.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/patronus-preview/fonts/geist-mono-latin-01c0aa.woff2" as="font" type="font/woff2" crossorigin> <!-- mono labels are on every page; swapping late shifted lines (CLS) --><link rel="stylesheet" href="/patronus-preview/_astro/Base.BGdU07Y3.css"></head><body><main style="padding: 96px 48px; display: grid; gap: 28px; max-width: 900px;"><p style="font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim-bone);">Patronus AI · site v2 · work in progress</p><h1 style="font-family: var(--display); font-weight: 400; font-size: 72px; line-height: 1; letter-spacing: -.03em;">Labs</h1><ul style="list-style: none; display: grid; gap: 14px; font-size: 22px;"><li><a href="/patronus-preview/">Homepage: the motion test (System A)</a></li><li><a href="/patronus-preview/lab/bleed/">Bleed lab: every image, four methods, three grounds</a></li><li><a href="/patronus-preview/lab/palette/">Palette lab: the earned colors, ten ways to use them</a></li></ul></main><!-- Links that leave patronus.ai open in a new tab (Evan, 2026-10-17). The build already sets this on every link in the
         HTML (src/site/external-links.mjs); this catches links that scripts add or point outside later (Greenhouse
         roles and Apply, the /imagery viewer's source). Same rule as the Webflow P26 / Nav embed. --><script>
    (function(){
      var IN=/^(?:www\.)?patronus\.ai$/i,SR='position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap';
      function fix(a){var h=a.getAttribute('href');if(!h||!/^https?:\/\//i.test(h))return;var u;try{u=new URL(h);}catch(e){return;}
        if(IN.test(u.hostname)||u.hostname===location.hostname)return;
        if(a.target!=='_blank')a.target='_blank';var r=(a.rel||'').split(/\s+/).filter(Boolean);['noopener','noreferrer'].forEach(function(x){if(r.indexOf(x)<0)r.push(x);});a.rel=r.join(' ');
        if(!/new tab/i.test(a.textContent+' '+(a.getAttribute('aria-label')||''))){var s=document.createElement('span');s.setAttribute('style',SR);s.setAttribute('data-newtab','');s.textContent=' (opens in a new tab)';a.appendChild(s);}}
      function all(n){if(n.nodeType!==1)return;if(n.tagName==='A')fix(n);n.querySelectorAll&&n.querySelectorAll('a[href]').forEach(fix);}
      all(document.body);
      new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==='attributes')fix(m.target);else m.addedNodes.forEach(all);});}).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['href']});
    })();
    </script></body></html>
